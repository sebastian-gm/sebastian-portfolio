<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sebastian Gonzalez — BI Developer / BI Engineer | Power BI, Azure, SQL</title>

    <!-- SEO -->
    <meta
      name="description"
      content="Business Intelligence Developer focused on Microsoft BI stacks: Power BI, DAX, Power Query, Azure SQL, Azure Data Factory, ADLS Gen2, Azure Functions, and Power Automate."
    />
    <meta name="author" content="Sebastian Gonzalez" />
    <meta
      name="keywords"
      content="BI Developer, BI Engineer, Business Intelligence Developer, Power BI, DAX, Power Query, Azure SQL, Azure Data Factory, ADLS Gen2, Azure Functions, Power Automate, SQL, Analytics Engineering"
    />
    <link rel="canonical" href="https://sebastiangm.com" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sebastian Gonzalez — BI Developer / BI Engineer" />
    <meta
      property="og:description"
      content="Power BI semantic models, DAX, Azure SQL, ADF, ADLS Gen2, Azure Functions, and governed BI pipelines."
    />
    <meta property="og:url" content="https://sebastiangm.com" />
    <!-- Put a preview image at public/og-image.jpg (1200x630 recommended) -->
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sebastian Gonzalez — BI Developer / BI Engineer" />
    <meta
      name="twitter:description"
      content="Microsoft BI stack: Power BI, DAX, Power Query, Azure SQL, ADF, ADLS Gen2, and Power Automate."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Color scheme hints -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f14" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon (place at public/favicon.png) -->
    <link rel="icon" href="/favicon.png" type="image/png" />

    <!-- Theme boot (avoid flash) -->
    <script>
      (function () {
        try {
          const saved = localStorage.getItem('theme'); // 'dark' | 'light' | null
          const useDark = saved === 'dark';
          document.documentElement.classList.toggle('dark', useDark);
        } catch (_) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
